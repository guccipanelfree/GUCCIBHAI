          EOF

          cat > app/src/main/java/com/example/shtile/MainActivity.kt <<'EOF'
          package com.example.shtile

          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  status = findViewById(R.id.status)

                  findViewById<Button>(R.id.testSafeBtn).setOnClickListener {
                      runTestSafe()
                  }

                  findViewById<Button>(R.id.testBrutalBtn).setOnClickListener {
                      runTestBrutal()
                  }

                  status.text = "Ready to test."
              }

              private fun runTestSafe() {
                  status.text = "Running Normal on .ixl..."

                  Thread {
                      val out = try {
                          val cmd =
                              "cd /data/local/tmp && (echo 7; sleep 4; echo 2; sleep 2) | /system/bin/toybox script -q -c './.ixl' /dev/null"

                          val p = ProcessBuilder("su", "-c", cmd)
                              .redirectErrorStream(true)
                              .start()

                          val text = p.inputStream.bufferedReader().readText()
                          val code = p.waitFor()

                          "$text\nexit=$code"
                      } catch (e: Exception) {
                          "Error: ${e.message}"
                      }

                      runOnUiThread {
                          status.text = "Normal Result:\n\n$out"
                      }
                  }.start()
              }

              private fun runTestBrutal() {
                  status.text = "Running Brutal on Gucci_brutal..."

                  Thread {
                      val out = try {
                          val cmd =
                              "cd /data/local/tmp && (echo 2; sleep 4; echo 7; sleep 2) | ./Gucci_brutal"

                          val p = ProcessBuilder("su", "-c", cmd)
                              .redirectErrorStream(true)
                              .start()

                          val text = p.inputStream.bufferedReader().readText()
                          val code = p.waitFor()

                          "$text\nexit=$code"
                      } catch (e: Exception) {
                          "Error: ${e.message}"
                      }

                      runOnUiThread {
                          status.text = "Brutal Result:\n\n$out"
                      }
                  }.start()
              }

              override fun onDestroy() {
                  status.text = ""
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
