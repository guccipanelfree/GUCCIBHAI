name: Settings APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/shtile
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Settings"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.shtile'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.shtile"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Settings"
                  android:theme="@style/Theme.AppCompat.DayNight">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".SafeTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_normal"
                      android:label="Gucci Normal"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">

                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.service.quicksettings.ACTIVE_TILE"
                          android:value="false"/>
                  </service>

                  <service
                      android:name=".BrutalTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_brutal"
                      android:label="Gucci Brutal"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">

                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.service.quicksettings.ACTIVE_TILE"
                          android:value="false"/>
                  </service>

                  <service
                      android:name=".HideTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_hide"
                      android:label="Hide"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">

                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.service.quicksettings.ACTIVE_TILE"
                          android:value="false"/>
                  </service>

                  <service
                      android:name=".UnhideTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_unhide"
                      android:label="Unhide"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">

                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.service.quicksettings.ACTIVE_TILE"
                          android:value="false"/>
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/shtile/SafeTileService.kt <<'EOF'
          package com.example.shtile

          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.widget.Toast

          class SafeTileService : TileService() {

              override fun onStartListening() {
                  super.onStartListening()

                  qsTile?.apply {
                      label = "Gucci Normal"
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }

              override fun onClick() {
                  super.onClick()

                  qsTile?.state = Tile.STATE_ACTIVE
                  qsTile?.updateTile()

                  Thread {
                      val code = runAsRoot()

                      Handler(Looper.getMainLooper()).post {
                          qsTile?.state = Tile.STATE_INACTIVE
                          qsTile?.updateTile()

                          Toast.makeText(
                              this,
                              if (code == 0) "Normal Done ✓"
                              else "Normal Exit $code",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }.start()
              }

              private fun runAsRoot(): Int {
                  return try {
                      val cmd =
                          "cd /data/local/tmp && (echo 7; sleep 4; echo 2; sleep 2) | /system/bin/toybox script -q -c './.ixl' /dev/null >/dev/null 2>&1"

                      val p = ProcessBuilder("su", "-c", cmd)
                          .redirectErrorStream(true)
                          .start()

                      p.inputStream.close()
                      p.waitFor()
                  } catch (e: Exception) {
                      -1
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/BrutalTileService.kt <<'EOF'
          package com.example.shtile

          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.widget.Toast

          class BrutalTileService : TileService() {

              override fun onStartListening() {
                  super.onStartListening()

                  qsTile?.apply {
                      label = "Gucci Brutal"
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }

              override fun onClick() {
                  super.onClick()

                  qsTile?.state = Tile.STATE_ACTIVE
                  qsTile?.updateTile()

                  Thread {
                      val code = runAsRoot()

                      Handler(Looper.getMainLooper()).post {
                          qsTile?.state = Tile.STATE_INACTIVE
                          qsTile?.updateTile()

                          Toast.makeText(
                              this,
                              if (code == 0) "Brutal Done ✓"
                              else "Brutal Exit $code",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }.start()
              }

              private fun runAsRoot(): Int {
                  return try {
                      val cmd =
                          "cd /data/local/tmp && (echo 2; sleep 4; echo 7; sleep 2) | ./Gucci_brutal >/dev/null 2>&1"

                      val p = ProcessBuilder("su", "-c", cmd)
                          .redirectErrorStream(true)
                          .start()

                      p.inputStream.close()
                      p.waitFor()
                  } catch (e: Exception) {
                      -1
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/HideTileService.kt <<'EOF'
          package com.example.shtile

          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.widget.Toast

          class HideTileService : TileService() {

              override fun onStartListening() {
                  super.onStartListening()

                  qsTile?.apply {
                      label = "Hide"
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }

              override fun onClick() {
                  super.onClick()

                  qsTile?.state = Tile.STATE_ACTIVE
                  qsTile?.updateTile()

                  Thread {
                      val code = try {
                          val p = ProcessBuilder(
                              "su",
                              "-c",
                              "pm disable-user --user 0 com.example.shtile/.MainActivity"
                          )
                              .redirectErrorStream(true)
                              .start()

                          p.inputStream.close()
                          p.waitFor()
                      } catch (e: Exception) {
                          -1
                      }

                      Handler(Looper.getMainLooper()).post {
                          qsTile?.state = Tile.STATE_INACTIVE
                          qsTile?.updateTile()

                          Toast.makeText(
                              this,
                              if (code == 0) "Hide Done ✓"
                              else "Hide Exit $code",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  }.start()
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/UnhideTileService.kt <<'EOF'
          package com.example.shtile

          import android.os.Handler
          import android.os.Looper
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService
          import android.widget.Toast

          class UnhideTileService : TileService() {

              override fun onStartListening() {
                  super.onStartListening()

                  qsTile?.apply {
